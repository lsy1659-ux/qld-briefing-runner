# QLD 그림자 검증 — 메리츠증권 Open API 일봉. **공식 신호가 아니다.**
#
# 마감 직후 메리츠가 준 종가로 «동결된 v1.0 이 같은 답을 냈을까» 를 기록만 한다.
# 텔레그램 · 공식 기록(live-history) 에는 닿지 않는다. 기록은 비공개 저장소의
# 별도 브랜치 `shadow-history-meritz` 에 쌓이고, 10~20 거래일 뒤 승격을 따로 판단한다
# (비공개 저장소 docs/SHADOW_DATA_VALIDATION.md §12 · §13).
#
# 로그에는 가격을 남기지 않는다 — 공개 저장소이고, 메리츠 약관이 시세 재배포를 금한다.
# 실행은 외부 정시 예약이 마감 뒤 여러 번 부른다 («마감 몇 분 뒤에 값이 오나» 가 측정
# 대상이다). 같은 세션 · 같은 판정은 한 줄만 남는다.
name: QLD Shadow (Meritz)

on:
  schedule:
    # 예비. 20:05 · 21:05 UTC (월~금) = 한국 05:05 · 06:05 (화~토).
    - cron: '5 20 * * 1-5'
    - cron: '5 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qld-shadow-meritz
  cancel-in-progress: false

env:
  APP_REPO: lsy1659-ux/qld-infinite-buy-backtest
  SHADOW_BRANCH: shadow-history-meritz
  SHADOW_DIR: .shadow-history
  SHADOW_STORE: data/shadow/history

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MERITZ_APP_KEY: ${{ secrets.MERITZ_APP_KEY }}
      MERITZ_APP_SECRET: ${{ secrets.MERITZ_APP_SECRET }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: 비공개 저장소 접근 토큰 확인
        env:
          HAS_TOKEN: ${{ secrets.QLD_REPO_TOKEN != '' }}
          HAS_MERITZ: ${{ secrets.MERITZ_APP_KEY != '' && secrets.MERITZ_APP_SECRET != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::QLD_REPO_TOKEN 이 없습니다."
            exit 1
          fi
          if [ "$HAS_MERITZ" != "true" ]; then
            echo "::notice::MERITZ_APP_KEY · MERITZ_APP_SECRET 이 없어 «키 없음» 으로 기록만 남깁니다."
          fi
          mkdir -p "$RUNNER_TEMP/qld"

      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - name: 그림자 기록 받기
        id: record
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.SHADOW_BRANCH }}
          path: ${{ env.SHADOW_DIR }}
          token: ${{ secrets.QLD_REPO_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 필요한 것 설치
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip > "$RUNNER_TEMP/qld/01-install.log" 2>&1
          python -m pip install -q -r requirements-lock.txt >> "$RUNNER_TEMP/qld/01-install.log" 2>&1

      - name: 공식 과거 자료 받기 (그림자 세션 직전까지만 쓴다)
        run: python run.py live-data > "$RUNNER_TEMP/qld/02-data.log" 2>&1

      - name: 메리츠 종가 읽고 v1.0 이 뭐라 했을지 기록
        run: |
          set -euo pipefail
          if [ "${{ steps.record.outcome }}" = "success" ]; then
            python scripts/meritz_shadow.py --store "$SHADOW_DIR" > "$RUNNER_TEMP/qld/03-fetch.log" 2>&1
          else
            echo "::warning::그림자 기록 브랜치를 받지 못해 읽기만 하고 기록하지 않습니다."
            python scripts/meritz_shadow.py > "$RUNNER_TEMP/qld/03-fetch.log" 2>&1
          fi

      - name: 공식 자료가 들어온 세션 대조
        if: ${{ !cancelled() && steps.record.outcome == 'success' }}
        continue-on-error: true
        run: python run.py shadow-compare --store "$SHADOW_DIR" > "$RUNNER_TEMP/qld/04-compare.log" 2>&1

      - name: 기록 검증
        id: verify
        if: ${{ !cancelled() && steps.record.outcome == 'success' }}
        run: |
          set -euo pipefail
          for name in shadow_readings.jsonl shadow_comparisons.jsonl; do
            git -C "$SHADOW_DIR" show "HEAD:$SHADOW_STORE/$name" > "$RUNNER_TEMP/qld/base-$name" 2>/dev/null \
              || : > "$RUNNER_TEMP/qld/base-$name"
            python scripts/shadow_record.py verify-record "$name" \
              "$RUNNER_TEMP/qld/base-$name" "$SHADOW_DIR/$SHADOW_STORE/$name" >> "$RUNNER_TEMP/qld/05-verify.log" 2>&1
          done

      - name: 그림자 기록 올리기 (덧붙이기만)
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$SHADOW_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SHADOW_STORE"
          if git diff --cached --quiet; then
            echo "::notice::덧붙일 것이 없습니다."
            exit 0
          fi
          git commit -q -m "그림자(메리츠): 빠른 시세 관측·비교 기록 (공식 신호 아님)" \
                        -m "공개 실행 저장소 ${{ github.repository }} 실행 ${{ github.run_id }}. 공식 신호·텔레그램·live-history 와 무관합니다."
          git push -q origin "HEAD:$SHADOW_BRANCH" > /dev/null 2>&1
