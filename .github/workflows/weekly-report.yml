# QLD 알림 주간 보고 — 매주 토요일 한국 15:00 (감시의 사후 점검 14:27 뒤), 알림방으로 한 통.
# 세션마다: 어느 길(빠른 · 공식) · 보낸 시각 · 확정 종가로 다시 판단해도 같았나 · 메리츠가 최종값이 된 시각.
# 기록(live-history 의 delivery_log)은 읽기만 한다. 로그에는 «weekly-report: 상태» 한 줄만.
name: QLD Weekly Report

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPO: lsy1659-ux/qld-infinite-buy-backtest
  RECORD_BRANCH: live-history
  RECORD_DIR: .live-history

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QLD_TELEGRAM_TOKEN: ${{ secrets.QLD_TELEGRAM_TOKEN }}
      QLD_TELEGRAM_CHAT_ID: ${{ secrets.QLD_TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: 준비
        run: mkdir -p "$RUNNER_TEMP/qld"

      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - name: 기록 받기 (읽기만)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.RECORD_BRANCH }}
          path: ${{ env.RECORD_DIR }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 필요한 것 설치
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip > "$RUNNER_TEMP/qld/01-install.log" 2>&1
          python -m pip install -q -r requirements-lock.txt >> "$RUNNER_TEMP/qld/01-install.log" 2>&1

      - name: 주간 보고 보내기
        run: python scripts/fast_briefing.py report --record-root "$RECORD_DIR" --weekly --days 7 --send > "$RUNNER_TEMP/qld/02-report.log" 2>&1

      - name: 결과 한 줄 (상태만)
        if: always()
        run: grep -h '^weekly-report:' "$RUNNER_TEMP/qld/02-report.log" 2>/dev/null | tail -1 || true
