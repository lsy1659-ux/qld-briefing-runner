# QLD 실제 계좌 누적 기록 — **선택 기능 · 기본 꺼짐.**
#
# 켜는 길은 둘뿐이다.
#   1) 사람이 직접 `Run workflow` 를 누른다 (그때 한 번).
#   2) 저장소 변수 QLD_ACCOUNT_LEDGER 를 `on` 으로 둔다 (아래 예약이 그때부터 매일 돈다).
# 변수가 없거나 `on` 이 아니면 예약 실행은 잡이 건너뛰어진다 — 아무것도 읽지 않는다.
#
# 메리츠 해외 잔고 · 외화 잔고 · 주문체결내역을 **조회만** 해서 비공개 저장소의 `account-history`
# 브랜치에 덧붙인다. 계좌번호 · 주문번호는 담지 않는다. 로그에는 아무 숫자도 남기지 않는다.
# 텔레그램 · 전략 신호 · live-history 와 무관하다 (비공개 저장소 docs/ACCOUNT_LEDGER.md · D-087).
name: QLD Account Ledger

on:
  workflow_dispatch:
  schedule:
    # 21:50 UTC (월~금) = 한국 06:50 (화~토). 변수가 `on` 일 때만 실제로 돈다.
    - cron: '50 21 * * 1-5'

permissions:
  contents: read

concurrency:
  group: qld-account-ledger
  cancel-in-progress: false

env:
  APP_REPO: lsy1659-ux/qld-infinite-buy-backtest
  LEDGER_BRANCH: account-history
  LEDGER_DIR: .account-history
  LEDGER_STORE: data/account/history

jobs:
  ledger:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.QLD_ACCOUNT_LEDGER == 'on' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MERITZ_APP_KEY: ${{ secrets.MERITZ_APP_KEY }}
      MERITZ_APP_SECRET: ${{ secrets.MERITZ_APP_SECRET }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: 토큰 · 키 확인
        env:
          HAS_TOKEN: ${{ secrets.QLD_REPO_TOKEN != '' }}
          HAS_MERITZ: ${{ secrets.MERITZ_APP_KEY != '' && secrets.MERITZ_APP_SECRET != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_MERITZ" != "true" ]; then
            echo "::error::QLD_REPO_TOKEN · MERITZ_APP_KEY · MERITZ_APP_SECRET 이 모두 있어야 합니다."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/qld"

      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - name: 계좌 기록 브랜치 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.LEDGER_BRANCH }}
          path: ${{ env.LEDGER_DIR }}
          token: ${{ secrets.QLD_REPO_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 필요한 것 설치
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip > "$RUNNER_TEMP/qld/01-install.log" 2>&1
          python -m pip install -q -r requirements-lock.txt >> "$RUNNER_TEMP/qld/01-install.log" 2>&1

      - name: 계좌 조회 · 기록
        run: python scripts/account_ledger.py --store "$LEDGER_DIR" > "$RUNNER_TEMP/qld/02-ledger.log" 2>&1

      - name: 기록 검증 (덧붙이기만 · 허용 목록 · 계좌번호/토큰 모양 거부)
        run: |
          set -euo pipefail
          for name in account_snapshots.jsonl account_executions.jsonl; do
            git -C "$LEDGER_DIR" show "HEAD:$LEDGER_STORE/$name" > "$RUNNER_TEMP/qld/base-$name" 2>/dev/null \
              || : > "$RUNNER_TEMP/qld/base-$name"
            python scripts/account_record.py verify-record "$name" \
              "$RUNNER_TEMP/qld/base-$name" "$LEDGER_DIR/$LEDGER_STORE/$name" >> "$RUNNER_TEMP/qld/03-verify.log" 2>&1
          done

      - name: 기록 올리기 (덧붙이기만)
        run: |
          set -euo pipefail
          cd "$LEDGER_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$LEDGER_STORE"
          if git diff --cached --quiet; then
            echo "::notice::덧붙일 것이 없습니다."
            exit 0
          fi
          git commit -q -m "계좌 기록: 메리츠 조회 스냅숏 · 새 체결 (신호 아님 · 주문 없음)" \
                        -m "공개 실행 저장소 ${{ github.repository }} 실행 ${{ github.run_id }}."
          git push -q origin "HEAD:$LEDGER_BRANCH" > /dev/null 2>&1
