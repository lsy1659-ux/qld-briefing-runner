# 승인형 자동 주문 — **선택 기능 · 기본 꺼짐 (D-089).**
#
# 저장소 변수 QLD_TRADE_MODE 가 dry(시험 — 승인해도 주문 안 냄) 또는 approve(실제 주문)일 때만 잡이 돈다.
# 변수가 없으면 잡은 건너뛰어진다 — 증권사도 텔레그램도 부르지 않는다.
#
# 외부 정시 예약(cron-job.org, 뉴욕 시간 평일 09:05~17:55 10분마다)이 부른다. 한 번 돌 때 할 일은
# 비공개 저장소 quantlab/live/meritz_trade.py 의 step 이 정한다:
#   · 조정하는 날 결정이 기록되면 → 계좌방에 «주문 승인 요청» (승인 코드 4글자)
#   · 계좌방에 «승인 코드» 가 오면 → 주문할 장 당일 뉴욕 09:35~15:30 에 MOC 로 매도 먼저 → 매수
#   · «취소 코드» 면 취소, 뉴욕 15:30 까지 답이 없으면 만료 (주문 안 함)
# 제안 · 사건은 비공개 저장소 account-history 브랜치에 덧붙인다. 주문번호 · 계좌번호는 남기지 않는다.
# 로그에는 «trade: 상태» 한 줄만 꺼낸다 — 숫자 없음.
name: QLD Trade Approval

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qld-trade-approval
  cancel-in-progress: false

env:
  APP_REPO: lsy1659-ux/qld-infinite-buy-backtest
  RECORD_BRANCH: live-history
  RECORD_DIR: .live-history
  RECORD_FILE: data/live/history/signal_history.jsonl
  LEDGER_BRANCH: account-history
  LEDGER_DIR: .account-history
  LEDGER_STORE: data/account/history

jobs:
  trade:
    if: ${{ vars.QLD_TRADE_MODE == 'dry' || vars.QLD_TRADE_MODE == 'approve' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MERITZ_APP_KEY: ${{ secrets.MERITZ_APP_KEY }}
      MERITZ_APP_SECRET: ${{ secrets.MERITZ_APP_SECRET }}
      QLD_ACCOUNT_TELEGRAM_TOKEN: ${{ secrets.QLD_ACCOUNT_TELEGRAM_TOKEN }}
      QLD_ACCOUNT_TELEGRAM_CHAT_ID: ${{ secrets.QLD_ACCOUNT_TELEGRAM_CHAT_ID }}
      QLD_TRADE_MODE: ${{ vars.QLD_TRADE_MODE }}
      QLD_TRADE_MAX_USD: ${{ vars.QLD_TRADE_MAX_USD }}
      QLD_TRADE_PILOT: ${{ vars.QLD_TRADE_PILOT }}
      QLD_ACCOUNT_BUDGET_USD: ${{ vars.QLD_ACCOUNT_BUDGET_USD }}
      QLD_ACCOUNT_INCLUDE_KRW: ${{ vars.QLD_ACCOUNT_INCLUDE_KRW }}
      QLD_ACCOUNT_FEE_BPS: ${{ vars.QLD_ACCOUNT_FEE_BPS }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: 비밀 확인
        env:
          HAS_ALL: ${{ secrets.QLD_REPO_TOKEN != '' && secrets.MERITZ_APP_KEY != '' && secrets.MERITZ_APP_SECRET != '' && secrets.QLD_ACCOUNT_TELEGRAM_TOKEN != '' && secrets.QLD_ACCOUNT_TELEGRAM_CHAT_ID != '' }}
        run: |
          if [ "$HAS_ALL" != "true" ]; then
            echo "::error::QLD_REPO_TOKEN · 메리츠 둘 · 계좌방 둘이 모두 있어야 합니다."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/qld"

      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - name: 공식 기록 받기 (읽기만)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.RECORD_BRANCH }}
          path: ${{ env.RECORD_DIR }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - name: 계좌 기록 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.LEDGER_BRANCH }}
          path: ${{ env.LEDGER_DIR }}
          token: ${{ secrets.QLD_REPO_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 필요한 것 설치
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip > "$RUNNER_TEMP/qld/01-install.log" 2>&1
          python -m pip install -q -r requirements-lock.txt >> "$RUNNER_TEMP/qld/01-install.log" 2>&1

      - name: 제안 · 승인 확인 · 주문
        continue-on-error: true
        run: python scripts/trade_approve.py --record "$RECORD_DIR/$RECORD_FILE" --store "$LEDGER_DIR" > "$RUNNER_TEMP/qld/02-trade.log" 2>&1

      - name: 결과 한 줄 (상태 낱말만 · 숫자 없음)
        if: always()
        run: grep -h '^trade:' "$RUNNER_TEMP/qld/02-trade.log" 2>/dev/null | tail -1 || true

      - name: 기록 검증 (덧붙이기만 · 허용 목록 · 주문번호/계좌번호 모양 거부)
        id: verify
        if: always()
        run: |
          set -euo pipefail
          for name in order_proposals.jsonl order_events.jsonl; do
            git -C "$LEDGER_DIR" show "HEAD:$LEDGER_STORE/$name" > "$RUNNER_TEMP/qld/base-$name" 2>/dev/null \
              || : > "$RUNNER_TEMP/qld/base-$name"
            python scripts/account_record.py verify-record "$name" \
              "$RUNNER_TEMP/qld/base-$name" "$LEDGER_DIR/$LEDGER_STORE/$name" >> "$RUNNER_TEMP/qld/03-verify.log" 2>&1
          done

      - name: 기록 올리기 (덧붙이기만)
        if: ${{ always() && steps.verify.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$LEDGER_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$LEDGER_STORE"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -q -m "주문 승인: 제안 · 사건 기록 (주문번호 없음)" \
                        -m "공개 실행 저장소 ${{ github.repository }} 실행 ${{ github.run_id }}."
          git pull -q --rebase origin "$LEDGER_BRANCH" > /dev/null 2>&1
          git push -q origin "HEAD:$LEDGER_BRANCH" > /dev/null 2>&1

      - name: 계좌 파일을 남기지 않음
        if: always()
        run: rm -f data/live/portfolio_state.local.json
