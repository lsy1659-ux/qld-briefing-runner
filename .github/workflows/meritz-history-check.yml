# 메리츠 과거 일봉 종가 = 공식(Yahoo) 차트 종가 인가 — 몇 년치 대조. 직접 `Run workflow` 할 때만.
#
# 결과(가격 포함)는 비공개 저장소의 shadow-history-meritz 브랜치 data/shadow/checks/ 에만 남긴다.
# 로그에는 «종목 같은 날/비교한 날» 한 줄만 꺼낸다 — 메리츠 시세는 재배포하지 않는다.
name: QLD Meritz History Check

on:
  workflow_dispatch:
    inputs:
      since:
        description: '비교 시작일 (YYYY-MM-DD)'
        default: '2006-06-21'

permissions:
  contents: read

concurrency:
  group: qld-shadow-meritz
  cancel-in-progress: false

env:
  APP_REPO: lsy1659-ux/qld-infinite-buy-backtest
  SHADOW_BRANCH: shadow-history-meritz
  SHADOW_DIR: .shadow-history

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MERITZ_APP_KEY: ${{ secrets.MERITZ_APP_KEY }}
      MERITZ_APP_SECRET: ${{ secrets.MERITZ_APP_SECRET }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: 비밀 확인
        env:
          HAS_ALL: ${{ secrets.QLD_REPO_TOKEN != '' && secrets.MERITZ_APP_KEY != '' && secrets.MERITZ_APP_SECRET != '' }}
        run: |
          if [ "$HAS_ALL" != "true" ]; then echo "::error::QLD_REPO_TOKEN · 메리츠 둘이 있어야 합니다."; exit 1; fi
          mkdir -p "$RUNNER_TEMP/qld"

      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - name: 그림자 기록 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.SHADOW_BRANCH }}
          path: ${{ env.SHADOW_DIR }}
          token: ${{ secrets.QLD_REPO_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 필요한 것 설치
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip > "$RUNNER_TEMP/qld/01-install.log" 2>&1
          python -m pip install -q -r requirements-lock.txt >> "$RUNNER_TEMP/qld/01-install.log" 2>&1

      - name: 공식 과거 자료 받기
        run: python run.py live-data > "$RUNNER_TEMP/qld/02-data.log" 2>&1

      - name: 메리츠 과거 종가 대조
        env:
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          OUT="$SHADOW_DIR/data/shadow/checks/meritz_history_check_$(date -u +%Y-%m-%d_%H%M).json"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          python scripts/meritz_history_check.py --since "$SINCE" --out "$OUT" > "$RUNNER_TEMP/qld/03-check.log" 2>&1

      - name: 결과 한 줄 (개수만)
        if: always()
        run: grep -h '^history-check:' "$RUNNER_TEMP/qld/03-check.log" 2>/dev/null | tail -1 || true

      - name: 결과 올리기 (비공개 브랜치)
        if: success()
        run: |
          set -euo pipefail
          cd "$SHADOW_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shadow/checks
          git diff --cached --quiet && exit 0
          git commit -q -m "그림자(메리츠): 과거 일봉 종가 대조 결과 (공식 신호 아님)" \
                        -m "공개 실행 저장소 ${{ github.repository }} 실행 ${{ github.run_id }}."
          git pull -q --rebase origin "$SHADOW_BRANCH" > /dev/null 2>&1
          git push -q origin "HEAD:$SHADOW_BRANCH" > /dev/null 2>&1
