# «내 계좌» 메시지 시험 — 사람이 직접 `Run workflow` 를 누를 때만 돈다 (D-088).
#
# 마지막으로 기록된 세션의 공식 결정에 지금 메리츠 계좌를 대 보고, 맨 위에 [TEST] 를 붙여
# 텔레그램으로 한 통 보낸다. 공식 알림 · 기록(live-history)에는 아무것도 쓰지 않는다.
# 저장소 변수 QLD_ACCOUNT_MODE 가 꺼져 있어도 돈다 — 켜기 전에 모양을 보는 용도다.
# 로그에는 아무 숫자도 남기지 않는다 (공개 저장소).
name: QLD Account Brief Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qld-account-brief-test
  cancel-in-progress: false

env:
  APP_REPO: lsy1659-ux/qld-infinite-buy-backtest
  RECORD_BRANCH: live-history
  RECORD_DIR: .live-history
  RECORD_FILE: data/live/history/signal_history.jsonl

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QLD_TELEGRAM_TOKEN: ${{ secrets.QLD_TELEGRAM_TOKEN }}
      QLD_TELEGRAM_CHAT_ID: ${{ secrets.QLD_TELEGRAM_CHAT_ID }}
      MERITZ_APP_KEY: ${{ secrets.MERITZ_APP_KEY }}
      MERITZ_APP_SECRET: ${{ secrets.MERITZ_APP_SECRET }}
      QLD_ACCOUNT_BUDGET_USD: ${{ vars.QLD_ACCOUNT_BUDGET_USD }}
      QLD_ACCOUNT_INCLUDE_KRW: ${{ vars.QLD_ACCOUNT_INCLUDE_KRW }}
      QLD_ACCOUNT_FEE_BPS: ${{ vars.QLD_ACCOUNT_FEE_BPS }}
      PYTHONIOENCODING: utf-8

    steps:
      - name: 토큰 · 키 확인
        env:
          HAS_ALL: ${{ secrets.QLD_REPO_TOKEN != '' && secrets.QLD_TELEGRAM_TOKEN != '' && secrets.QLD_TELEGRAM_CHAT_ID != '' && secrets.MERITZ_APP_KEY != '' && secrets.MERITZ_APP_SECRET != '' }}
        run: |
          if [ "$HAS_ALL" != "true" ]; then
            echo "::error::QLD_REPO_TOKEN · 텔레그램 둘 · 메리츠 둘이 모두 있어야 합니다."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/qld"

      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - name: 기록 받기 (읽기만)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.RECORD_BRANCH }}
          path: ${{ env.RECORD_DIR }}
          token: ${{ secrets.QLD_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: 필요한 것 설치
        run: |
          set -euo pipefail
          python -m pip install -q --upgrade pip > "$RUNNER_TEMP/qld/01-install.log" 2>&1
          python -m pip install -q -r requirements-lock.txt >> "$RUNNER_TEMP/qld/01-install.log" 2>&1

      - name: 시세 받기 (자료 상태 · TQQQ 종가 확인용)
        run: python run.py live-data > "$RUNNER_TEMP/qld/02-data.log" 2>&1

      - name: 내 계좌 메시지 [TEST] 보내기
        run: python scripts/account_brief.py --record "$RECORD_DIR/$RECORD_FILE" --send --test-banner > "$RUNNER_TEMP/qld/03-account.log" 2>&1

      - name: 계좌 파일을 남기지 않음
        if: always()
        run: rm -f data/live/portfolio_state.local.json
